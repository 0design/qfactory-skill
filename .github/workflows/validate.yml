name: validate
# Checks the plugin as Claude Code reads it: file list, manifests, an install into an empty HOME.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_CODE_VERSION: 2.1.293 # pinned; raise on purpose
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: File list
        # Only the files of the plugin; no symlinks, no binaries, nothing else.
        run: node scripts/check-tree.mjs
      - name: Validate plugin and marketplace
        run: |
          # `validate <dir>` reads the marketplace manifest when the directory has one; the plugin manifest is named explicitly.
          npx --yes "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" plugin validate --strict .
          npx --yes "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" plugin validate --strict .claude-plugin/plugin.json
      - name: Install into an empty HOME
        # No login needed: add the marketplace from this checkout, install the plugin, list it.
        run: |
          npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          export HOME="$(mktemp -d)"
          claude plugin marketplace add ./
          claude plugin install qfactory@qfactory
          claude plugin list | tee "$RUNNER_TEMP/list.txt"
          grep -q 'qfactory@qfactory' "$RUNNER_TEMP/list.txt"
